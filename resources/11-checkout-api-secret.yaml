# The Deployment (12-checkout-api-deployment.yaml) reads this Secret's
# password under the key "DB_PASSWORD" - but the key actually stored here
# is "db-password". That mismatch is broken-state #1: the kubelet can't
# resolve the env var, so the container never starts
# (CreateContainerConfigError). This is the bug the AI is asked to find.
apiVersion: v1
kind: Secret
metadata:
  name: checkout-api-secrets
  namespace: k8s-ai-demo
type: Opaque
stringData:
  db-password: "correct-horse-battery-staple"
