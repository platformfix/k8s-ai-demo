apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: k8s-ai-demo
  labels:
    app: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: nginx:alpine
          ports:
            - containerPort: 80
