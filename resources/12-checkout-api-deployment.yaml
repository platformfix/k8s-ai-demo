apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: k8s-ai-demo
  labels:
    app: checkout-api
spec:
  replicas: 1
  # RollingUpdate (the default) surges a new pod before killing the old
  # one - fine normally, but this Deployment's pod is sometimes
  # deliberately broken and will never become Ready, so the old pod would
  # never be scaled down and reset.sh/preflight.sh would leave two
  # checkout-api pods running side by side. Recreate always kills the old
  # pod first, so exactly one pod exists after every apply, whichever
  # direction (broken or fixed) it moved in. Caught empirically:
  # preflight.sh's own rehearsal cycle left a stale Running pod alongside
  # the freshly-broken one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: checkout-api
          image: nginx:alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: checkout-api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: checkout-api-secrets
                  # BROKEN (see 11-checkout-api-secret.yaml): the Secret's
                  # actual key is "db-password", not "DB_PASSWORD".
                  key: DB_PASSWORD
